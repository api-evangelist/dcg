aid: dcg
name: DCG
description: 'Digital Currency Group (DCG) is a crypto-industry venture and holding company that
  describes itself as the enduring investor and operator of the crypto industry. Investing in digital
  currencies and blockchain since 2012, DCG has built a portfolio of 200+ equity investments, 50+ fund
  investments, and 30+ token and digital-asset positions across 25+ countries. It owns and operates
  category-leading subsidiaries including Grayscale (crypto asset management), Foundry (mining and
  staking infrastructure), CoinDesk (media, data and events), Genesis (institutional financial
  services), Luno (consumer wallet), HQ, and TradeBlock. DCG is a corporate holding and investment
  company and does not publish a public developer API; this profile was added to the API Evangelist
  network as a portfolio-company lead.'
